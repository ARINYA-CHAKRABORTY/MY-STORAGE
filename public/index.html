<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="sprocket-strip top" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◈</span>
    <div>
      <h1>ARCHIVE</h1>
      <p class="subtitle">private reel — stored off-device</p>
    </div>
  </div>
  <div class="header-actions">
    <span id="frame-count" class="frame-count">0 frames</span>
    <button id="backup-btn" class="logout-btn" title="Download everything as a zip">⤓ Backup</button>
    <button id="logout-btn" class="logout-btn" title="Sign out">Sign out</button>
  </div>
</header>

<div class="section-toggle">
  <button id="tab-gallery" class="section-tab active">Gallery</button>
  <button id="tab-files" class="section-tab">Files</button>
</div>

<nav id="album-tabs" class="album-tabs"></nav>

<div id="upload-status" class="upload-status" hidden></div>

<main id="gallery-view">
  <div id="grid-container"></div>
  <div id="empty-state" class="empty-state" hidden>
    <p>No frames yet.</p>
    <p class="muted">Tap the + button to add a photo or video — it's sent straight to your private Telegram channel.</p>
  </div>
</main>

<main id="files-view" hidden>
  <div id="files-container"></div>
  <div id="files-empty-state" class="empty-state" hidden>
    <p>No files yet.</p>
    <p class="muted">Tap the + button and choose a document — you'll be able to sort it into a folder.</p>
  </div>
</main>

<div class="sprocket-strip bottom" aria-hidden="true"></div>

<!-- floating upload button -->
<button id="fab" class="fab" aria-label="Add a frame or file">+</button>

<!-- upload modal -->
<div id="upload-modal" class="modal-overlay" hidden>
  <form id="upload-form" class="modal-card">
    <h2>Add to archive</h2>
    <label class="file-drop" id="file-drop">
      <input type="file" id="file-input" hidden />
      <span id="file-label">Choose a photo, video, or document</span>
    </label>

    <label class="modal-field" id="album-field">
      <span>Album</span>
      <select id="album-select">
        <option value="Camera">Camera</option>
        <option value="Screenshots">Screenshots</option>
        <option value="WhatsApp Images">WhatsApp Images</option>
        <option value="WhatsApp Video">WhatsApp Video</option>
        <option value="Downloads">Downloads</option>
        <option value="Uploads">Other</option>
      </select>
    </label>

    <label class="modal-field" id="folder-field" hidden>
      <span>Folder (type a new name or pick an existing one)</span>
      <input type="text" id="folder-input" list="folder-options" placeholder="e.g. Tax Documents" />
      <datalist id="folder-options"></datalist>
    </label>

    <label class="modal-field">
      <span>Caption (optional)</span>
      <input type="text" id="caption-input" placeholder="A few words…" maxlength="120" />
    </label>
    <div class="modal-actions">
      <button type="button" id="modal-cancel" class="btn-ghost">Cancel</button>
      <button type="submit" id="upload-btn" class="btn-solid">Upload</button>
    </div>
  </form>
</div>

<!-- full-size viewer -->
<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="lightbox-close" aria-label="Close">✕</button>
  <button id="lightbox-prev" class="lightbox-nav prev" aria-label="Previous">‹</button>
  <div id="lightbox-content" class="lightbox-content"></div>
  <button id="lightbox-next" class="lightbox-nav next" aria-label="Next">›</button>
  <p id="lightbox-caption" class="lightbox-caption"></p>
</div>

<script src="app.js"></script>
</body>
</html>
